name: Tag

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tag.yaml
      - pubspec.yaml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Validate
        shell: bash
        run: |
          dart pub get
          dart format --set-exit-if-changed lib test
          dart analyze
          dart test

      - name: Create Tag
        shell: bash
        run: |
          set -e

          dart pub global activate -sgit https://github.com/islandlifetechnologies/action-pubspec-tag
          dart pub global run dart_version_autotag:tag --token "${{ secrets.GITHUB_TOKEN }}"
